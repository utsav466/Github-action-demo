
name: Test user work flow
# Controls when the action will run. Workflow runs when manualy triggered using the UI or API.

on:
  workflow_dispatch:
    #Inputs the workflow accepts.
    inputs:
      number1:
        #Friendly descreption to show in the UI instead of 'number1'.
        description: 'First Number'
        # Default value if no value is explicitly provided.
        default: '0'
        #Input has to be provided for the workflow to run.
        required: true
        #The data type of the input.
        type: number

      number2:
        #Friendly descreption to show in the UI instead of 'number1'.
        description: 'Second Number'
        #Default value if no value is explicitly provided.
        default: '0'
        # Input has to be provided for the workflwo to run.
        required: true
        # The data type of the input.
        type: number

jobs:
  add_numbers:
    runs-on: ubuntu-latest

    steps:
      - name: Add numbers
        id: sum
        run: |
            result=$(( ${{ inputs.number1 }} + ${{ inputs.number2 }} ))
            echo "sum=$result" >> $GITHUB_OUTPUT
            

      - name: Display sum
        run: |
            echo "The sum of ${{ inputs.number1 }} and ${{ inputs.number2 }} is ${{ steps.sum.outputs.sum }}"




        
